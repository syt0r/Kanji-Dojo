name: Build iOS IPA (unsigned, for sideloading)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle identifier to sign the build with (any reverse-DNS style id you own on your Apple ID)'
        required: true
        default: 'com.example.kanjidojo'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Config.xcconfig
        run: |
          mkdir -p iosApp/Configuration
          printf 'APP_NAME = KanjiDojo\nCODE_SIGN_IDENTITY =\nTEAM_ID =\nPROV_PROFILE =\n' > iosApp/Configuration/Config.xcconfig

      - name: Archive (no code signing)
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cd iosApp
          xcodebuild \
            -project KanjiDojoApp.xcodeproj \
            -scheme KanjiDojoApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/KanjiDojo.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            BUNDLE_ID="$BUNDLE_ID" \
            archive

      - name: Package unsigned IPA
        run: |
          cd iosApp/build/KanjiDojo.xcarchive/Products/Applications
          mkdir Payload
          mv *.app Payload/
          zip -r ../../../KanjiDojo-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KanjiDojo-unsigned-ipa
          path: iosApp/build/KanjiDojo-unsigned.ipa
          retention-days: 7
